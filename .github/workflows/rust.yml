name: rust

on:
  push:
    paths: ["crates/**", "Cargo.*", "fixtures/**", "packaging/**", ".github/workflows/rust.yml"]
  pull_request:
    paths: ["crates/**", "Cargo.*", "fixtures/**", "packaging/**", ".github/workflows/rust.yml"]

env:
  CARGO_TERM_COLOR: always

jobs:
  fedora:
    runs-on: ubuntu-latest
    container: fedora:latest
    steps:
      - run: dnf install -y git gcc rust cargo rustfmt clippy
      - uses: actions/checkout@v4
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - run: cargo test --workspace --locked --release

  rpm:
    # Builds the Fedora package from packaging/fedora/armory.spec (tests run in the fedora job).
    runs-on: ubuntu-latest
    container: fedora:latest
    steps:
      - run: dnf install -y git gcc rust cargo rpm-build redhat-rpm-config rust-srpm-macros
      - uses: actions/checkout@v4
      - name: Build the RPM from a source tarball of this commit
        run: |
          git config --global --add safe.directory "$PWD"
          v=$(rpmspec -q --qf '%{version}\n' packaging/fedora/armory.spec | head -1)
          mkdir -p ~/rpmbuild/SOURCES
          git archive --prefix "bitcoinarmory-$v/" -o ~/rpmbuild/SOURCES/bitcoinarmory-$v.tar.gz HEAD
          rpmbuild -bb --nocheck packaging/fedora/armory.spec
          rpm -qlp ~/rpmbuild/RPMS/*/armory-*.rpm
          dnf install -y ~/rpmbuild/RPMS/*/armory-*.rpm
          armory about
          # (the container skips documentation on install, so check the package's file list)
          test "$(rpm -qlp ~/rpmbuild/RPMS/*/armory-*.rpm | grep -cE 'man1/armory.1|completions/armory$|_armory$|armory.fish$')" = 4

  macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - run: cargo test --workspace --locked --release

  legacy-oracle:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: tools/legacy-oracle/build.sh
      - run: diff <(tools/legacy-oracle/build/harness) tools/legacy-oracle/expected-output.txt

  regtest:
    # End-to-end against a real bitcoind (crates/armory/tests/regtest.rs): the only test of the
    # online paths against Core itself.
    runs-on: ubuntu-latest
    env:
      CORE_VERSION: "29.1"
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Download Bitcoin Core
        run: |
          f=bitcoin-${CORE_VERSION}-x86_64-linux-gnu.tar.gz
          curl -fsSLO https://bitcoincore.org/bin/bitcoin-core-${CORE_VERSION}/$f
          curl -fsSLO https://bitcoincore.org/bin/bitcoin-core-${CORE_VERSION}/SHA256SUMS
          grep " $f\$" SHA256SUMS | sha256sum -c -
          tar xzf $f
          echo "ARMORY_BITCOIND=$PWD/bitcoin-${CORE_VERSION}/bin/bitcoind" >> "$GITHUB_ENV"
      - run: cargo test -p armory --test regtest --release --locked -- --nocapture
      - run: cargo test -p armory --bin armory --release --locked regtest -- --nocapture
